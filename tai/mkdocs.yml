site_name: Tailored AI
site_url: https://tai-src.github.io
theme:
  name: material
  custom_dir: overrides
  font:
    text: Roboto
    code: Roboto Mono
  language: en
  icon:
    logo: material/puzzle-edit
  favicon: assets/images/puzzle-edit.png
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - toc.follow
    - toc.integrate
    - navigation.top
    - search.highlight
    - header.autohide
    - announce.dismiss
    - navigation.footer
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      primary: amber
      accent: orange
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: amber
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: amber
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
# Custom variables
extra:
  github_repo: https://github.com/TAI-src/tai-src.github.io
  page_path: tai/docs
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/TAI-src
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/u/taisrc

copyright: Copyright &copy; 2026 Vanessa Volz
markdown_extensions:
  - sane_lists
  - abbr
  - footnotes
  - admonition
  - tables
  - toc:
      permalink: true
  - md_in_html
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.details
  - attr_list
  - pymdownx.betterem
  - pymdownx.blocks.caption
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
plugins:
  - privacy
  - search
  - offline
  - macros:
      module_name: main
  - exclude:
      glob:
        - "projects/project_template.md"
nav:
  - Home: index.md
  - Projects: projects/index.md
  - About: about.md
