site_name: Tailored AI
site_url: https://tai-src.github.io
theme:
  name: material
  custom_dir: overrides
  font:
    text: Roboto
    code: Roboto Mono
  language: en
  icon:
    logo: material/puzzle-edit
  favicon: assets/images/puzzle-edit.png
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - toc.follow
    - toc.integrate
    - navigation.top
    - search.highlight
    - header.autohide
    - announce.dismiss
    - navigation.footer
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      primary: amber
      accent: orange
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: amber
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: amber
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
# Custom variables
extra:
  page_path: tai/docs
  featured_authors:
    - vvolz
    - kvdb
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/TAI-src
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/u/taisrc

copyright: Copyright &copy; 2026 Vanessa Volz
markdown_extensions:
  - sane_lists
  - abbr
  - footnotes
  - admonition
  - tables
  - toc:
      permalink: true
  - md_in_html
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.details
  - attr_list
  - pymdownx.betterem
  - pymdownx.blocks.caption
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
plugins:
  - privacy
  - search
  - offline
  - tags
  - blog:
      blog_dir: projects
      blog_toc: true
      post_dir: "{blog}/posts"
      post_date_format: yyyy/MM
      post_url_date_format: yyyy/MM
      post_url_format: "{slug}"
      post_excerpt: required
      post_excerpt_max_authors: 0
      post_excerpt_separator: <!-- more -->
      post_readtime: false
      archive: true
      archive_name: Archive
      categories: true
      categories_name: Research Themes
      authors: true
      authors_file: "{blog}/.authors.yml"
      authors_profiles: true
      authors_profiles_name: Team
      pagination: true
      pagination_per_page: 5
      draft: false
      draft_on_serve: true
      draft_if_future_date: false
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
extra_css:
  - stylesheets/extra.css
nav:
  - Home: index.md
  - Projects:
    - projects/index.md
  - About: about.md
