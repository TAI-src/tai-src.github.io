site_name: Tailored AI
site_url: https://tai-src.github.io
theme:
  name: mkdocs
# Custom variables
extra:
  github_repo: https://github.com/TAI-src/tai-src.github.io
  page_path: tai/docs
markdown_extensions:
  - sane_lists
  - admonition
  - toc:
      permalink: true
  - md_in_html
  - pymdownx.tilde
plugins:
  - search
  - macros:
      module_name: main
  - exclude:
      glob:
        - "projects/project_template.md"
nav:
  - Home: index.md
  - Projects: projects/index.md
  - About: about.md
