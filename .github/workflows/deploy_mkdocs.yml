name: Build MkDocs (and push to gh-pages branch)
on:
  push:
    paths:
      - "tai/**"
    branches:
      - main

  pull_request:
    paths:
      - "tai/**"
    branches:
      - main

  workflow_dispatch: # allow triggering workflow manually
    inputs:
      reason:
        description: "Reason for Running"
        required: false
        default: "Manually trigger deploy"


jobs:
  deploy:
    name: Build and push page
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Needed to push to gh-pages

    steps:
      # 1️⃣ Checkout the code
      - name: Checkout main branch
        uses: actions/checkout@v7

      # 2️⃣ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.12

      # 3️⃣ Install MkDocs and requirements
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tai/requirements.txt

      # 4️⃣ Build the MkDocs site
      - name: Build MkDocs site
        run: mkdocs build -f tai/mkdocs.yml

      # 5️⃣ Deploy the built site to gh-pages if not a PR
      - name: Deploy to gh-pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: tai/site        # MkDocs build output folder
          publish_branch: gh-pages
          force_orphan: false       # Important: avoids force push
          keep_files: false         # Overwrites old files in gh-pages branch
